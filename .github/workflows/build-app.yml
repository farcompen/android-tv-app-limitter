name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: 'TvTimeGuard_AndroidTV_Project (2)/**/*.gradle*'

      - name: Ensure Gradle Wrapper Jar Exists
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          mkdir -p gradle/wrapper

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading gradle-wrapper.jar..."

            curl -fL -o gradle/wrapper/gradle-wrapper.jar \
              https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          fi

          echo "Gradle Wrapper files:"
          ls -lh gradle/wrapper/

      - name: Grant Execute Permission for Gradlew
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: chmod +x gradlew

      - name: Verify Gradle Wrapper
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          ls -lh gradlew
          ls -lh gradle/wrapper/
          ./gradlew --version

      - name: Build Debug & Release APK
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvTimeGuard_XiaomiTV_Release_APK
          path: './TvTimeGuard_AndroidTV_Project (2)/app/build/outputs/apk/release/*.apk'
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TvTimeGuard_XiaomiTV_Debug_APK
          path: './TvTimeGuard_AndroidTV_Project (2)/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
