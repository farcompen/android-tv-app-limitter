name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar

          gradle wrapper \
            --gradle-version 8.4 \
            --distribution-type bin

          echo "Wrapper files:"
          ls -lh gradle/wrapper/

      - name: Verify Gradle Wrapper
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          chmod +x gradlew

          echo "Checking GradleWrapperMain..."
          jar tf gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain

          echo "Testing Gradle Wrapper..."
          ./gradlew --version

      - name: Build Release APK
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Build Debug APK
        working-directory: './TvTimeGuard_AndroidTV_Project (2)'
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: TvTimeGuard_XiaomiTV_Release_APK
          path: './TvTimeGuard_AndroidTV_Project (2)/app/build/outputs/apk/release/*.apk'
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TvTimeGuard_XiaomiTV_Debug_APK
          path: './TvTimeGuard_AndroidTV_Project (2)/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
